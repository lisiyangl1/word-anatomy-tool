<style>
  /* ============ 设计令牌 ============ */
  :root{
    --paper:#f7f4ef;
    --card:#ffffff;
    --line:#e8e2d8;
    --ink:#1d1a15;
    --muted:#7c7367;

    --accent:#b45309;          /* 焦糖色主强调 */
    --accent-soft:#fdf4e6;

    --pre:#2563eb;  --pre-bg:#eff4ff;  --pre-line:#dbe6ff;   /* 前缀：蓝 */
    --root:#dc2626; --root-bg:#fff1f1; --root-line:#ffdcdc;  /* 词根：红 */
    --suf:#0f766e;  --suf-bg:#ecfdf7;  --suf-line:#cdf2e8;   /* 后缀：绿 */
    --stem:#57534e; --stem-bg:#f6f4f1; --stem-line:#e7e3dc;  /* 词干：灰 */

    --radius:18px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  /* Tailwind CDN 不可用时的最小兜底（与 Tailwind 同名规则一致，不会冲突） */
  .max-w-3xl{ max-width:48rem; }
  .mx-auto{ margin-left:auto; margin-right:auto; }

  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 背景氛围：两团极淡的暖光 */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60vw 50vw at 12% -8%, #ffeacd 0%, rgba(255,234,205,0) 62%),
      radial-gradient(52vw 46vw at 96% 4%, #e6f0ff 0%, rgba(230,240,255,0) 60%);
  }
  ::selection{ background:#ffe0b2; }
  .serif{ font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC",serif; }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
  .muted{ color:var(--muted); }

  /* ============ 卡片 ============ */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(29,26,21,.04), 0 14px 34px -26px rgba(29,26,21,.45);
  }

  /* ============ 输入框：聚焦时边框平滑变色 ============ */
  .search-input{
    height:52px;
    border:1.5px solid var(--line);
    background:#fbf9f6;
    border-radius:14px;
    transition:border-color .35s var(--ease), box-shadow .35s var(--ease),
               background-color .35s var(--ease), transform .35s var(--ease);
    outline:none;
  }
  .search-input::placeholder{ color:#a9a094; }
  .search-input:focus{
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 4px rgba(180,83,9,.12), 0 10px 26px -20px rgba(180,83,9,.9);
  }
  .search-wrap:focus-within .search-icon{ color:var(--accent); transform:scale(1.06); }
  .search-icon{ transition:color .35s var(--ease), transform .35s var(--ease); }

  /* ============ 主按钮 + 波纹 ============ */
  .btn-primary{
    position:relative; overflow:hidden;
    background:var(--ink); color:#fff;
    border-radius:14px;
    transition:background-color .3s var(--ease), transform .18s var(--ease), box-shadow .3s var(--ease);
    box-shadow:0 10px 24px -16px rgba(29,26,21,.9);
  }
  .btn-primary:hover{ background:#000; box-shadow:0 16px 30px -18px rgba(29,26,21,.95); }
  .btn-primary:active{ transform:scale(.97); }
  .btn-primary:disabled{ opacity:.75; cursor:not-allowed; transform:none; }
  .ripple{
    position:absolute; border-radius:9999px; pointer-events:none;
    background:rgba(255,255,255,.5);
    transform:scale(0); animation:ripple .62s ease-out forwards;
  }
  @keyframes ripple{ to{ transform:scale(3.4); opacity:0; } }

  /* 次级按钮（复制/折叠等） */
  .btn-ghost{
    border:1px solid var(--line); background:#fff; border-radius:11px;
    transition:border-color .25s, background-color .25s, color .25s, transform .18s;
  }
  .btn-ghost:hover{ border-color:#d6cdbe; background:#fdfbf8; color:var(--ink); }
  .btn-ghost:active{ transform:scale(.97); }

  /* ============ 加载动画 ============ */
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,.28); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skeleton{ position:relative; overflow:hidden; background:#efeae2; border-radius:8px; }
  .skeleton::after{
    content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
    animation:shimmer 1.35s infinite;
  }
  @keyframes shimmer{ 100%{ transform:translateX(100%); } }

  /* ============ 结果入场：淡入上滑 ============ */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
  .fade-up{ animation:fadeUp .5s var(--ease) both; }
  .stagger-1{ animation-delay:.04s } .stagger-2{ animation-delay:.1s }
  .stagger-3{ animation-delay:.16s } .stagger-4{ animation-delay:.22s }
  .stagger-5{ animation-delay:.28s }

  /* ============ 折叠面板：平滑高度过渡 ============ */
  /* 注意：类名不要用 collapse —— 会与 Tailwind 的 visibility:collapse 工具类冲突 */
  .fold{
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .42s var(--ease), opacity .32s var(--ease), padding .42s var(--ease);
  }
  .fold.open{ opacity:1; }
  .chev{ transition:transform .38s var(--ease); }
  [aria-expanded="true"] .chev{ transform:rotate(180deg); }

  /* ============ 徽标 / 标签 ============ */
  .badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; line-height:1; letter-spacing:.02em;
    padding:5px 8px; border-radius:999px;
    background:var(--accent-soft); color:#8a4a05; border:1px solid #f3e0c4;
    transition:background-color .25s, transform .25s;
  }
  .badge-gray{ background:#f3f1ee; color:#6b635a; border-color:#e5e0d8; }

  .tag{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 12px; border-radius:999px;
    background:#fff; border:1px solid var(--line);
    font-size:13.5px; color:#3f3a33;
    transition:transform .22s var(--ease), border-color .22s, box-shadow .22s, background-color .22s, color .22s;
    cursor:pointer;
  }
  .tag:hover{
    transform:translateY(-2px);
    border-color:#d9cdb9; background:#fffaf3; color:#8a4a05;
    box-shadow:0 10px 20px -14px rgba(29,26,21,.6);
  }
  .tag:active{ transform:translateY(0) scale(.98); }

  /* ============ 音标卡 ============ */
  .phone-card{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:12px 14px; border-radius:13px;
    background:#fbf9f6; border:1px solid var(--line);
    transition:background-color .28s, border-color .28s, transform .2s var(--ease);
    text-align:left;
  }
  .phone-card:hover{ background:#fff; border-color:#d9cdb9; }
  .phone-card:active{ transform:scale(.985); }

  /* ============ 音节 ============ */
  .syl{
    font-size:16px; font-weight:600; letter-spacing:.01em;
    padding:5px 10px; border-radius:9px;
    background:#fbf7f0; border:1px solid #f0e7d8; color:#3b342b;
  }
  .syl-dot{ color:#c3b8a7; font-weight:700; }

  /* ============ 词根词缀色块 ============ */
  .seg{
    display:flex; flex-direction:column; gap:3px;
    padding:9px 13px; border-radius:12px; border:1px solid; min-width:58px;
    transition:transform .22s var(--ease), box-shadow .22s;
  }
  .seg:hover{ transform:translateY(-2px); box-shadow:0 10px 20px -16px rgba(29,26,21,.8); }
  .seg-t{ font-size:15px; font-weight:700; letter-spacing:.01em; }
  .seg-m{ font-size:11.5px; line-height:1.35; opacity:.85; }
  .seg-pre{  color:var(--pre);  background:var(--pre-bg);  border-color:var(--pre-line); }
  .seg-root{ color:var(--root); background:var(--root-bg); border-color:var(--root-line); }
  .seg-suf{  color:var(--suf);  background:var(--suf-bg);  border-color:var(--suf-line); }
  .seg-stem{ color:var(--stem); background:var(--stem-bg); border-color:var(--stem-line); }
  .plus{ display:flex; align-items:center; color:#bdb3a4; font-size:15px; font-weight:600; }

  /* ============ 释义卡：hover 上浮 ============ */
  .meaning{
    border:1px solid var(--line); border-radius:14px; background:#fff;
    padding:14px 16px;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
  }
  .meaning:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 30px -18px rgba(29,26,21,.5);
    border-color:#ddd3c3;
  }
  .pos{
    font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:lowercase;
    padding:3px 7px; border-radius:6px; background:#f4efe7; color:#8a6a3e;
  }
  .ex{
    margin-top:11px; padding:10px 12px; border-radius:10px;
    background:#fbf9f6; border-left:3px solid #ecd3ab;
  }
  mark{
    background:linear-gradient(transparent 60%, #ffe2b8 60%);
    color:inherit; font-weight:600; padding:0 1px;
  }

  /* ============ Toast ============ */
  #toast{
    position:fixed; left:50%; bottom:30px; z-index:70;
    transform:translate(-50%,16px); opacity:0; pointer-events:none;
    transition:opacity .32s var(--ease), transform .32s var(--ease);
    background:#1d1a15; color:#fff; font-size:13px;
    padding:10px 18px; border-radius:999px;
    box-shadow:0 18px 34px -18px rgba(0,0,0,.8);
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  /* 滚动条 */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#dbd3c6; border-radius:99px; border:3px solid var(--paper); }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* 尊重「减少动效」偏好 */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  @media (max-width:640px){
    :root{ --radius:16px; }
    .search-input{ height:50px; }
  }
</style>
</head>

<script>
/* ============================================================================
 * 单词解剖台 · 单文件纯前端实现
 * ----------------------------------------------------------------------------
 * 结构：
 *   1. 数据层：WORDS（四六级词库）、CURATED（人工精讲词条）、PREFIXES/SUFFIXES/ROOTS
 *   2. 算法层：syllabify（音节）、decompose（词根词缀）、lemma（词形还原）、suggest（纠错）
 *   3. 渲染层：renderWord / renderSection / collapse 等
 *   4. 交互层：查询、加载、折叠、复制、波纹、Toast
 * ========================================================================== */

/* ---------------------------------------------------------------------------
 * 1. 数据层
 * ------------------------------------------------------------------------- */

/* 词库：{ w:单词, lv:[等级], uk:英音, us:美音, tr:[[词性,中文]], ex:[[例句,译文]], sy:[同义词] }
   来源：kajweb/dict 词书（CET-4 / CET-6 全量 + 高中/初中基础词），构建后共 7536 条。
   释义与例句版权归原词书所有，仅供学习与技术演示；代码许可见仓库 LICENSE（MIT）。 */
const WORDS = __WORDS_JSON__;

/* 人工精讲词条：覆盖常见构词范例，segs 按顺序拼接即为原词
   segs: [词段, 类型(pre|root|suf|stem|base), 释义] */
const CURATED = {
  unbelievable:{ syl:'un·be·liev·a·ble', note:'un- + believe + -able，字面「不可被相信的」，引申为「难以置信的」。',
    segs:[['un','pre','不；非'],['believ','root','相信（believe 的词干）'],['able','suf','可…的']] },
  incredible:{ syl:'in·cred·i·ble', note:'in-(不) + cred(相信) + -ible(可…的)；与 credit、creed 同源。',
    segs:[['in','pre','不'],['cred','root','相信'],['ible','suf','可…的']] },
  international:{ syl:'in·ter·na·tion·al', note:'inter-(之间) + nation(国家) + -al(…的)。',
    segs:[['inter','pre','在…之间'],['nation','root','国家；民族'],['al','suf','…的']] },
  transformation:{ syl:'trans·for·ma·tion', note:'trans-(转变) + form(形状) + -ation(行为/结果)。',
    segs:[['trans','pre','转变；横过'],['form','root','形状；形成'],['ation','suf','行为；结果']] },
  transportation:{ syl:'trans·por·ta·tion', note:'trans-(横过) + port(搬运) + -ation(行为)。',
    segs:[['trans','pre','横过；转移'],['port','root','搬运'],['ation','suf','行为；结果']] },
  introduction:{ syl:'in·tro·duc·tion', note:'intro-(向内) + duct(引导) + -ion(行为)。',
    segs:[['intro','pre','向内'],['duct','root','引导'],['ion','suf','行为；状态']] },
  construction:{ syl:'con·struc·tion', note:'con-(共同/加强) + struct(建造) + -ion(行为)。',
    segs:[['con','pre','共同；加强'],['struct','root','建造'],['ion','suf','行为；结果']] },
  invisible:{ syl:'in·vis·i·ble', note:'in-(不) + vis(看) + -ible(可…的)；同源词 vision、visual。',
    segs:[['in','pre','不'],['vis','root','看'],['ible','suf','可…的']] },
  television:{ syl:'tel·e·vi·sion', note:'tele-(远) + vis(看) + -ion；字面「远处的影像」。',
    segs:[['tele','pre','远'],['vis','root','看'],['ion','suf','名词后缀']] },
  telephone:{ syl:'tel·e·phone', note:'tele-(远) + phone(声音)。',
    segs:[['tele','pre','远'],['phone','root','声音']] },
  telegraph:{ syl:'tel·e·graph', note:'tele-(远) + graph(写/记录)。',
    segs:[['tele','pre','远'],['graph','root','写；记录']] },
  bicycle:{ syl:'bi·cy·cle', note:'bi-(二) + cycle(轮/循环)。',
    segs:[['bi','pre','二；双'],['cycle','root','轮；循环']] },
  biography:{ syl:'bi·og·ra·phy', note:'bio(生命) + graph(写) + -y(名词后缀)。',
    segs:[['bio','root','生命'],['graph','root','写'],['y','suf','名词后缀']] },
  autobiography:{ syl:'au·to·bi·og·ra·phy', note:'auto-(自己) + bio(生命) + graph(写) + -y。',
    segs:[['auto','pre','自己；自动'],['bio','root','生命'],['graph','root','写'],['y','suf','名词后缀']] },
  antibiotic:{ syl:'an·ti·bi·ot·ic', note:'anti-(抗) + bio(生命) + -tic(…的/剂)。',
    segs:[['anti','pre','反；抗'],['bio','root','生命'],['tic','suf','…的；剂']] },
  submarine:{ syl:'sub·ma·rine', note:'sub-(在下) + mar(海) + -ine(…的)。',
    segs:[['sub','pre','在下'],['mar','root','海'],['ine','suf','…的']] },
  misunderstand:{ syl:'mis·un·der·stand', note:'mis-(错误地) + understand(理解)。',
    segs:[['mis','pre','错误地'],['understand','root','理解']] },
  impossible:{ syl:'im·pos·si·ble', note:'im-(不) + poss(能力) + -ible(可…的)；possible 的否定式。',
    segs:[['im','pre','不'],['poss','root','能力（posse）'],['ible','suf','可…的']] },
  unhappy:{ syl:'un·hap·py', note:'un-(不) + happy(快乐的)。',
    segs:[['un','pre','不'],['happy','root','快乐的']] },
  disagree:{ syl:'dis·a·gree', note:'dis-(不) + agree(同意)。',
    segs:[['dis','pre','不；相反'],['agree','root','同意']] },
  preview:{ syl:'pre·view', note:'pre-(预先) + view(看)。',
    segs:[['pre','pre','预先；在前'],['view','root','看']] },
  review:{ syl:'re·view', note:'re-(再/重新) + view(看)。',
    segs:[['re','pre','再；重新'],['view','root','看']] },
  export:{ syl:'ex·port', note:'ex-(向外) + port(搬运)。',
    segs:[['ex','pre','向外'],['port','root','搬运']] },

/* 合法音节首（两个辅音可整体后移的组合） */
const ONSET2 = new Set(['bl','br','ch','cl','cr','dr','dw','fl','fr','gl','gr','kn','ph','pl','pr','qu','sc',

const VOWELS = 'aeiouy';

/** 判断 y 是否为元音：词首不是；位于辅音之后且其后为非元音时视作元音 */
function isYVowel(w, i) {
  if (w[i] !== 'y') return false;
  if (i === 0) return false;
  if (VOWELS.includes(w[i + 1] || '')) return false;
  return true;
}

/** 音节拆分：返回音节数组 */
function syllabify(raw) {
  const w = (raw || '').toLowerCase();
  if (!w) return [];
  if (SYL_EXCEPTIONS[w]) return SYL_EXCEPTIONS[w].split('·');
  // 连字符直接作为分界
  if (w.includes('-')) return w.split('-').filter(Boolean);

  const n = w.length;
  // 1) 标记每个字符是否为元音核
  const isV = new Array(n).fill(false);
  for (let i = 0; i < n; i++) {
    if (w[i] === 'y') isV[i] = isYVowel(w, i);
    else isV[i] = 'aeiou'.includes(w[i]);
  }
  // 2) 词尾不发音的 e / ed / es
  if (n > 3 && w[n - 1] === 'e') {
    // -le 结尾（table）保留 e 作为音节核；-ee/-ie/-oe 保留
    const prev = w[n - 2], before = w[n - 3];
    const keep = (prev === 'l' && before && !VOWELS.includes(before)) ||
                 (prev === 'e') || (prev === 'i') || (prev === 'o');
    if (!keep) isV[n - 1] = false;
  }
  if (/[^td]ed$/.test(w)) isV[n - 2] = false;              // walked, played
  if (/[^sxzcg]es$/.test(w)) {                              // makes, comes
    isV[n - 2] = false;
  }
  if (/[^aeiou]e[sd]$/.test(w)) isV[n - 2] = false;         // used, hoped

  // 3) 合并相邻元音为一个音节核（-tion/-sion/-cial 等按一个核处理）
  const nuclei = [];
  for (let i = 0; i < n; i++) {
    if (!isV[i]) continue;
    let j = i;
    while (j + 1 < n && isV[j + 1]) j++;
    // 元音串内部是否需要断开（hiatus）：ia/io/iu/ua/uo/eo 在非 -tion 型环境中分开
    const group = w.slice(i, j + 1);
    const prevC = w[i - 1] || '';
    const merged = /^(ia|io|iu|ua|uo|eo|oe)$/.test(group) &&
                   !(['t','s','c','g'].includes(prevC) && /^(ion|ial|ious|ient|ience|eous|eon)/.test(w.slice(i)));
    if (merged && group.length === 2) {
      nuclei.push([i, i]); nuclei.push([i + 1, j]);
    } else {
      nuclei.push([i, j]);
    }
    i = j;
  }
  if (nuclei.length <= 1) return [w];

  // 4) 在相邻音节核之间分配辅音
  const cuts = [];
  for (let k = 0; k < nuclei.length - 1; k++) {
    const endPrev = nuclei[k][1];
    const startNext = nuclei[k + 1][0];
    const cluster = w.slice(endPrev + 1, startNext);
    let cut;                                             // 切点（下一音节起始下标）
    if (cluster.length === 0) cut = startNext;
    else if (cluster.length === 1) cut = startNext - 1;
    else if (cluster.length === 2) cut = ONSET2.has(cluster) ? startNext - 2 : startNext - 1;
    else if (cluster.length === 3) cut = ONSET3.has(cluster.slice(1)) ? startNext - 2
                                     : (ONSET2.has(cluster.slice(1)) ? startNext - 2 : startNext - 1);
    else cut = startNext - 1;
    cuts.push(Math.max(endPrev + 1, Math.min(cut, startNext)));
  }

  // 5) 拼接
  const out = [];
  let last = 0;
  for (const c of cuts) { out.push(w.slice(last, c)); last = c; }
  out.push(w.slice(last));
  // 过滤空段 & 单字母尾段并入前一段
  const res = out.filter(Boolean);
  if (res.length > 1 && res[res.length - 1].length === 1 && !VOWELS.includes(res[res.length - 1])) {
    const t = res.pop(); res[res.length - 1] += t;
  }
  return res;
}

/* ---- 3.2 词根词缀拆解 ---- */

/* 无词根释义的常见词干补充（让“词干”一格也有中文含义） */
const STEM_GLOSS = {
  beauti:'美（beauty）', fortunate:'幸运的', happy:'快乐的', study:'学习', difficult:'困难的', beauty:'美',
  communi:'交流；共同', commun:'共同', educat:'教育', applic:'应用', import:'进口',
  color:'颜色', dream:'梦', light:'光', night:'夜', water:'水', hand:'手',
  wonder:'奇迹；想知道', friend:'朋友', child:'孩子', mother:'母亲', father:'父亲',
  school:'学校', teach:'教', learn:'学', work:'工作', help:'帮助', play:'玩',
  care:'关心', hope:'希望', use:'使用', move:'移动', live:'居住', love:'爱',
  speak:'说', read:'读', write:'写', sing:'唱', dance:'跳舞', think:'思考',
  travel:'旅行', market:'市场', office:'办公室', country:'国家', city:'城市'
};

/** 判断字符串是否正好是一个后缀 */
function isSuffix(s) { return SUFFIXES.some(([sfx]) => sfx === s); }

/** 在 pos 位置尝试最长词根匹配 */
function rootAt(str, pos) {
  let best = null;
  for (const [variants, m] of ROOTS) {
    for (const v of variants.split('/')) {
      if (v.length < 3) continue;
      if (str.startsWith(v, pos) && (!best || v.length > best.v.length)) best = { v, m };
    }
  }
  return best;
}

/** 词干能否被“完整”拆成 2 段以上词根（如 bio+techno） */
function rootChain(core) {
  const parts = [];
  let i = 0;
  while (i < core.length) {
    const r = rootAt(core, i);
    if (!r) return null;
    parts.push({ t: r.v, k: 'root', m: r.m });
    i += r.v.length;
  }
  return parts.length >= 2 ? parts : null;
}

/** 找一个合法后缀：剥离后词干 ≥3，且词干成词 / 是词根 / 足够长 */
function suffixOf(str) {
  for (const [sfx, m] of SUFFIXES) {
    if (!str.endsWith(sfx)) continue;
    const rem = str.slice(0, str.length - sfx.length);
    if (rem.length < 3) continue;
    if (WORD_MAP.has(rem) || rootAt(rem, 0) || rem.length >= 5) return [sfx, m];
  }
  return null;
}

/** 找前缀：剩余部分须像真词干，且不跨越元音-元音边界 */
function findPrefix(word) {
  for (const [p, m] of PREFIXES) {
    if (!word.startsWith(p)) continue;
    const rest = word.slice(p.length);
    if (rest.length < 3) continue;
    if (VOWELS.includes(p[p.length - 1]) && VOWELS.includes(rest[0])) continue;
    if (WORD_MAP.has(rest) || rootAt(rest, 0) || suffixOf(rest)) return [p, m];
  }
  return null;
}

/** 主拆解函数：返回 { segs:[{t,k,m}], syl:[], note, auto, unsplittable } */
function decompose(word) {
  const low = word.toLowerCase();

  // a) 人工精讲优先
  const cur = CURATED[low];
  if (cur) {
    const isBase = cur.segs.length === 1 && cur.segs[0][1] === 'base';
    return {
      segs: cur.segs.map(([t, k, m]) => ({ t, k, m })),
      syl: cur.syl ? cur.syl.split('·') : syllabify(low),
      note: cur.note, auto: false, unsplittable: isBase
    };
  }

  const segs = [];

  // b) 前缀
  let stem = low;
  if (!PREFIX_BLOCKLIST.has(low)) {
    const pre = findPrefix(low);
    if (pre) { segs.push({ t: pre[0], k: 'pre', m: pre[1] }); stem = low.slice(pre[0].length); }
  }

  // c) 后缀（最长匹配）
  const suffix = suffixOf(stem);
  const core = suffix ? stem.slice(0, stem.length - suffix[0].length) : stem;

  // d) 词干内部：整体词根 / 连续词根链 / 词根 + 少量残余 / 纯词干
  let coreSegs;
  const exact = rootAt(core, 0);
  if (exact && exact.v.length === core.length) {
    coreSegs = [{ t: core, k: 'root', m: exact.m }];
  } else {
    const chain = rootChain(core);
    if (chain) coreSegs = chain;
    else if (exact && core.length - exact.v.length <= 2) coreSegs = [{ t: core, k: 'root', m: exact.m }];
    else coreSegs = [{ t: core, k: 'stem', m: STEM_GLOSS[core] || (WORD_MAP.has(core) ? '词干（本词基础义）' : '核心词干') }];
  }

  segs.push(...coreSegs);
  if (suffix) segs.push({ t: suffix[0], k: 'suf', m: suffix[1] });

  // e) 拆不开 → 明确告知，其余模块照常显示
  if (segs.length <= 1) {
    return {
      segs: [{ t: low, k: 'base', m: '原生词；整体记忆' }],
      syl: syllabify(low),
      note: '', auto: true, unsplittable: true
    };
  }
  return {
    segs,
    syl: syllabify(low),
    note: '由内置构词规则自动拆解，供辅助记忆；个别词的历史词源可能略有出入。',
    auto: true
  };
}

/* ---- 3.3 词形还原（running -> run） ---- */
function lemmaCandidates(w) {
  const out = [];
  const push = s => { if (s && s.length > 1 && !out.includes(s)) out.push(s); };
  if (w.endsWith('ies')) push(w.slice(0, -3) + 'y');
  if (w.endsWith('ied')) push(w.slice(0, -3) + 'y');
  if (w.endsWith('ves')) { push(w.slice(0, -3) + 'f'); push(w.slice(0, -3) + 'fe'); }
  if (w.endsWith('es')) push(w.slice(0, -2));
  if (w.endsWith('s')) push(w.slice(0, -1));
  if (w.endsWith('ed')) { push(w.slice(0, -2)); push(w.slice(0, -1)); push(w.slice(0, -2) + 'e'); }
  if (w.endsWith('ing')) { push(w.slice(0, -3)); push(w.slice(0, -3) + 'e'); push(w.slice(0, -4)); }
  if (w.endsWith('ier')) push(w.slice(0, -3) + 'y');
  if (w.endsWith('iest')) push(w.slice(0, -4) + 'y');
  if (w.endsWith('er')) { push(w.slice(0, -2)); push(w.slice(0, -1)); }
  if (w.endsWith('est')) { push(w.slice(0, -3)); push(w.slice(0, -2)); }
  if (w.endsWith('ly')) { push(w.slice(0, -2)); push(w.slice(0, -2) + 'le'); }
  if (w.endsWith('ily')) push(w.slice(0, -3) + 'y');
  return out;
}

/* ---- 3.4 拼写纠错建议（编辑距离） ---- */
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 2) return 99;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function suggest(word, limit = 6) {
  const w = word.toLowerCase();
  const scored = [];
  for (const cand of WORD_LIST) {
    if (Math.abs(cand.length - w.length) > 2) continue;
    if (cand[0] !== w[0] && cand.length > w.length + 1) continue;
    const d = editDistance(w, cand);
    if (d <= 2) scored.push([cand, d]);
  }
  const pre = c => { let i = 0; while (i < c.length && i < w.length && c[i] === w[i]) i++; return i; };
  scored.sort((a, b) => a[1] - b[1] || pre(b[0]) - pre(a[0]) || a[0].length - b[0].length);
  const res = scored.slice(0, limit).map(x => x[0]);
  if (res.length < limit) {                       // 兜底：同前缀词
    for (const cand of WORD_LIST) {
      if (res.length >= limit) break;
      if (cand.startsWith(w.slice(0, 2)) && !res.includes(cand)) res.push(cand);
    }
  }
  return res;
}

/* ---------------------------------------------------------------------------
 * 4. 工具函数
 * ------------------------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

/** 在例句中高亮目标词（含词形变化） */
function highlight(sentence, word) {
  const safe = esc(sentence);
  const stem = word.replace(/(e|y)$/i, '');
  const re = new RegExp('\\b(' + stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' + esc(msg);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/** 折叠面板：平滑高度过渡（展开后放开高度限制，避免内部内容被裁切） */
function makeCollapsible(container, open = true) {
  container.querySelectorAll('[data-collapse]').forEach(btn => {
    const panel = container.querySelector('#' + btn.dataset.collapse);
    if (!panel) return;

    const expand = () => {
      btn.setAttribute('aria-expanded', 'true');
      panel.classList.add('open');
      panel.style.maxHeight = panel.scrollHeight + 'px';
      const onEnd = e => {
        if (e.propertyName !== 'max-height') return;
        panel.style.maxHeight = 'none';
        panel.removeEventListener('transitionend', onEnd);
      };
      panel.addEventListener('transitionend', onEnd);
      // 兜底：低动效偏好或过渡未触发时，同样放开限制
      setTimeout(() => { if (btn.getAttribute('aria-expanded') === 'true') panel.style.maxHeight = 'none'; }, 520);
    };

    const collapse = () => {
      btn.setAttribute('aria-expanded', 'false');
      if (panel.style.maxHeight === 'none' || !panel.style.maxHeight) {
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
      void panel.offsetHeight;                        // 强制重排，让收起也有起点高度
      panel.style.maxHeight = '0px';
      panel.classList.remove('open');
    };

    if (open) {
      btn.setAttribute('aria-expanded', 'true');
      panel.classList.add('open');
      panel.style.maxHeight = 'none';
    } else {
      btn.setAttribute('aria-expanded', 'false');
      panel.classList.remove('open');
      panel.style.maxHeight = '0px';
    }

    btn.addEventListener('click', () => {
      if (btn.getAttribute('aria-expanded') === 'true') collapse(); else expand();
    });
  });
}

/** 折叠面板骨架 */
function section(id, title, hint, bodyHTML, delayClass = '') {
  return `

      <span class="text-[13px] font-semibold tracking-wide">${title}</span>
      <span class="text-[11.5px] muted">${hint}</span>
      <svg class="chev ml-auto shrink-0 muted" width="15" height="15" viewBox="0 0 24 24" fill="none"

}

/** 词根词缀色块渲染 */
function renderSegments(d) {
  const blocks = d.segs.map(s => `

      <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full inline-block" style="background:var(--root)"></i>词根</span>
      <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full inline-block" style="background:var(--suf)"></i>后缀</span>
      <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full inline-block" style="background:var(--stem)"></i>词干</span>

  if (d.unsplittable) {

          <span class="font-semibold mono">${esc(d.segs[0].t)}</span>

        </p>
        <p class="mt-1.5 text-[12px] muted">其余模块（音标、音节、释义、同义词）不受影响，正常查看即可。</p>
      </div>`;
  }

  return `${legend}
    <div class="flex flex-wrap items-stretch gap-2">${blocks}</div>
    ${d.note ? `<p class="mt-3 text-[11.5px] muted leading-relaxed">${esc(d.note)}</p>` : ''}`;
}

/** 释义 + 例句 */
function renderMeanings(entry) {
  return entry.tr.map(([pos, cn], i) => {
    const hasOwn = !!(entry.ex && entry.ex[i]);
    const ex = hasOwn ? entry.ex[i] : (entry.ex && entry.ex[0] ? entry.ex[0] : null);
    const reused = !!ex && !hasOwn;               // 只有一条例句时，后续释义标注“共用例句”
    return `
    <div class="meaning">
      <div class="flex items-start gap-2.5">

          <div class="ex">
            <div class="flex items-start gap-2">
              <p class="flex-1 text-[13.5px] leading-relaxed" style="color:#3f3a33">${highlight(ex[0], entry.w)}</p>
              ${reused ? '<span class="shrink-0 text-[10px] tracking-wide muted pt-[3px]">共用例句</span>' : ''}
            </div>

  }).join('');
}

/** 同义词标签 */
function renderSynonyms(entry) {
  if (!entry.sy || !entry.sy.length) {

/** 结果区事件：复制、发音、同义词跳转 */
function bindResultEvents(entry, d, syl) {
  const copyBtn = $('#copyBtn');
  if (copyBtn) copyBtn.addEventListener('click', () => copyAll(entry, d, syl));

  document.querySelectorAll('#result .say').forEach(btn => {
    btn.addEventListener('click', () => speak(btn.dataset.w, btn.dataset.lang));
  });

  document.querySelectorAll('#result .syn').forEach(btn => {
    btn.addEventListener('click', () => {
      const w = btn.dataset.w;
      $('#q').value = w;
      query(w);
    });
  });
}

/** 朗读（浏览器语音，失败静默） */
function speak(word, lang) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = lang === 'uk' ? 'en-GB' : 'en-US';
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  } catch (e) { /* 忽略 */ }
}

/** 一键复制全部解析结果 */
function copyAll(entry, d, syl) {
  const lines = [];
  lines.push(`【${entry.w}】`);
  if (entry.lv && entry.lv.length) lines.push(`等级：${entry.lv.join(' / ')}`);
  lines.push(`英音：${entry.uk ? '/' + entry.uk + '/' : '—'}`);
  lines.push(`美音：${entry.us ? '/' + entry.us + '/' : '—'}`);
  lines.push(`音节：${syl.join('·')}`);
  lines.push('');
  lines.push('【词根词缀】');
  if (d.unsplittable) {
    lines.push(`${entry.w} —— 原生词/单根词，无可拆分的前缀、词根或后缀，建议整体记忆。`);
  } else {
    lines.push(d.segs.map(s => `${s.t}（${SEG_LABEL[s.k] || '词干'}：${s.m}）`).join(' + '));
  }
  if (d.note) lines.push(`注：${d.note}`);
  lines.push('');
  lines.push('【释义与例句】');
  entry.tr.forEach(([pos, cn], i) => {
    lines.push(`${i + 1}. ${pos ? '[' + pos + '] ' : ''}${cn}`);
    const ex = entry.ex && entry.ex[i] ? entry.ex[i] : (entry.ex && entry.ex[0] || null);
    if (ex) { lines.push(`   例：${ex[0]}`); if (ex[1]) lines.push(`   译：${ex[1]}`); }
  });
  if (entry.sy && entry.sy.length) {
    lines.push('');
    lines.push('【同义词】' + entry.sy.join('、'));
  }
  lines.push('');
  lines.push('— 由「单词解剖台」生成');

  const text = lines.join('\n');
  const done = () => toast('已复制全部解析结果');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('复制失败，请手动选择文本'); }
  document.body.removeChild(ta);
}

/** 空状态 / 未找到 / 加载 */
function renderEmpty() {
  $('#result').innerHTML = `
    <div class="card p-8 sm:p-12 text-center fade-up">
      <div class="text-[42px] leading-none" style="opacity:.28">✳</div>
      <p class="mt-4 text-[15px] font-medium">输入一个英文单词开始解剖</p>
      <p class="mt-1.5 text-[13px] muted">音标、音节、词根词缀、释义例句、同义词，五层一起看。</p>
    </div>`;
}

function renderLoading(word) {
  $('#result').innerHTML = `
    <div class="card p-5 sm:p-6">
      <div class="flex items-center gap-2 text-[12.5px] muted">
        <span class="spinner" style="border-color:rgba(29,26,21,.18);border-top-color:#b45309"></span>
        正在解析 <span class="mono" style="color:var(--ink)">${esc(word)}</span> …
      </div>
      <div class="mt-4 skeleton h-[38px] w-2/5"></div>
      <div class="mt-3 grid grid-cols-2 gap-2.5">
        <div class="skeleton h-[62px]"></div><div class="skeleton h-[62px]"></div>
      </div>
      <div class="mt-3 skeleton h-[58px]"></div>
      <div class="mt-3 skeleton h-[74px]"></div>
    </div>`;
}

function renderNotFound(word) {
  const sug = suggest(word);
  $('#result').innerHTML = `
    <div class="card p-6 sm:p-8 fade-up">
      <div class="flex items-start gap-3">
        <span class="shrink-0 w-9 h-9 rounded-full grid place-items-center text-[16px]"
              style="background:var(--accent-soft);color:#8a4a05">?</span>
        <div class="min-w-0">
          <p class="text-[15px] font-medium">词库里暂时没有「${esc(word)}」</p>
          <p class="mt-1 text-[13px] muted leading-relaxed">
            可能是拼写有误，或该词不在四六级词表内。换个拼写试试，或从下面挑一个：
          </p>
        </div>
      </div>
      ${sug.length ? `<div class="mt-4 flex flex-wrap gap-2">
        ${sug.map(s => `<button type="button" class="tag syn" data-w="${esc(s)}">${esc(s)}</button>`).join('')}
      </div>` : ''}
      <div class="mt-4 text-[12px] muted">提示：一次只查一个单词；动词、名词的变形会自动还原为原形。</div>
    </div>`;

  document.querySelectorAll('#result .syn').forEach(btn => {
    btn.addEventListener('click', () => { $('#q').value = btn.dataset.w; query(btn.dataset.w); });
  });
}

/* ---------------------------------------------------------------------------
 * 6. 交互层
 * ------------------------------------------------------------------------- */
let loadingTimer = null;

function query(raw) {
  const input = (raw || '').trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '');
  $('#q').value = raw && raw.trim() ? raw.trim() : '';
  toggleClearBtn();
  if (!input) { $('#q').focus(); return; }

  const low = input.toLowerCase();
  if (/\s/.test(input)) { renderNotFound(input); return; }

  setLoading(true);
  renderLoading(low);

  clearTimeout(loadingTimer);
  // 保留一小段加载感知时间，避免闪烁
  loadingTimer = setTimeout(() => {
    let entry = WORD_MAP.get(low);
    let meta = {};

    // 词形还原：running -> run
    if (!entry) {
      for (const c of lemmaCandidates(low)) {
        if (WORD_MAP.has(c)) {
          entry = WORD_MAP.get(c);
          meta.lemmaNote = `按词形变化匹配到原形「${entry.w}」`;
          meta.extraTag = '词形还原';
          break;
        }
      }
    }
    // 极端情况：只差大小写 / 末尾 e
    if (!entry && WORD_MAP.has(low + 'e')) { entry = WORD_MAP.get(low + 'e'); meta.lemmaNote = `匹配到「${entry.w}」`; }

    setLoading(false);
    if (entry) renderWord(entry, meta);
    else renderNotFound(low);
  }, 320);
}

function setLoading(on) {
  const btn = $('#submitBtn'), txt = $('#btnText'), spin = $('#btnSpin');
  btn.disabled = on;
  txt.textContent = on ? '解析中' : '解析';
  spin.classList.toggle('hidden', !on);
}

function toggleClearBtn() {
  $('#clearBtn').classList.toggle('hidden', !$('#q').value);
}

/* 波纹 */
function ripple(e) {
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
  const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
  span.style.left = x + 'px';
  span.style.top = y + 'px';
  btn.appendChild(span);
  setTimeout(() => span.remove(), 640);
}

/* 初始化 */
function init() {
  $('#dictSize').textContent = WORD_LIST.length.toLocaleString('en-US');

  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    query($('#q').value);
  });

  const btn = $('#submitBtn');
  btn.addEventListener('click', ripple);

  $('#q').addEventListener('input', toggleClearBtn);
  $('#q').addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('#q').value = ''; toggleClearBtn(); }
  });

  $('#clearBtn').addEventListener('click', () => {
    $('#q').value = '';
    toggleClearBtn();
    $('#q').focus();
  });

  document.querySelectorAll('.sample').forEach(b => {
    b.addEventListener('click', () => { $('#q').value = b.dataset.w; query(b.dataset.w); });
  });

  $('#randomBtn').addEventListener('click', () => {
    const w = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
    $('#q').value = w;
    query(w);
  });

  // 快捷键 "/" 聚焦输入框
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  });

  renderEmpty();

  // 支持 ?w=word 直达（便于分享链接 / 收藏）
  const preset = new URLSearchParams(location.search).get('w');
  if (preset) setTimeout(() => { $('#q').value = preset; query(preset); }, 120);
}

document.addEventListener('DOMContentLoaded', init);
</script>
